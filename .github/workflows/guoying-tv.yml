name: 果影 TV - Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [hongguo-tv-standalone, hongguo-tv-rea-native]
    paths:
      - 'HongguoTV/**'
      - '.github/workflows/guoying-tv.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate preinstalled Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME; ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
      - name: Install Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER" || { echo "sdkmanager not found"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build installable debug APK
        working-directory: HongguoTV
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GuoyingTV-AndroidTV-debug-APK
          path: HongguoTV/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

